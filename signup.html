<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Haks - Stay Ahead of the Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        
        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "your-api-key",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "your-app-id"
        };
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();
        
        // Make Firebase Auth available globally
        window.firebaseAuth = auth;
        window.googleProvider = googleProvider;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithPopup = signInWithPopup;
        window.updateProfile = updateProfile;
    </script>
    
    <!-- CORRECTED PATHS -->
    <link rel="stylesheet" href="/public/signup.css">
    <link rel="stylesheet" href="/public/styles.css">
</head>
<body>
    <div class="signup-wrapper">
        <!-- Left Column - Branding -->
        <div class="branding-column slide-in-left">
            <div class="branding-content">
                <h2>Welcome to Haks</h2>
                <p>Stay Ahead of the Game</p>
                <div class="features-list">
                    <div class="feature-item">
                        <span class="feature-icon">✓</span>
                        <span>Secure Authentication</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">✓</span>
                        <span>Fast & Reliable</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">✓</span>
                        <span>Easy to Use</span>
                    </div>
                </div>
            </div>
        </div>
                
        <!-- Right Column - Form -->
        <div class="form-column slide-in-right">
            <div class="signup-container">
                <div class="form-header fade-in">
                    <h1>Create Account</h1>
                    <p>Start your journey with us today</p>
                </div>
                
                <!-- Success/Error Messages -->
                <div id="messageContainer" class="message-container" style="display: none;">
                    <div id="messageText" class="message-text"></div>
                </div>
                                
                <form id="signupForm" class="fade-in">
                    <div class="input-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required minlength="6">
                        <small class="password-hint">Minimum 6 characters</small>
                    </div>
                    
                    <div class="input-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                    </div>
                                        
                    <div class="checkbox-group">
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="terms" name="terms" required>
                        </div>
                        <label for="terms">
                            I agree to the <a href="/terms" target="_blank">Terms of Service</a> and 
                            <a href="/privacy" target="_blank">Privacy Policy</a>
                        </label>
                    </div>
                                        
                    <button type="submit" class="signup-btn" id="signupBtn">
                        <span class="btn-text">Create Account</span>
                        <span class="btn-loader" style="display: none;">
                            <div class="spinner"></div>
                        </span>
                    </button>
                </form>
                                
                <div class="divider">
                    <span>or continue with</span>
                </div>
                                
                <button class="google-btn" id="googleSignIn">
                    <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span>Continue with Google</span>
                </button>
                                
                <div class="signin-link">
                    Already have an account? <a href="/login" id="signinLink">Sign in</a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Firebase Auth JavaScript -->
    <script>
        // Wait for Firebase to be initialized
        window.addEventListener('load', function() {
            const signupForm = document.getElementById('signupForm');
            const googleSignInBtn = document.getElementById('googleSignIn');
            const signupBtn = document.getElementById('signupBtn');
            const messageContainer = document.getElementById('messageContainer');
            const messageText = document.getElementById('messageText');
            
            // Show message function
            function showMessage(message, isError = false) {
                messageText.textContent = message;
                messageContainer.className = `message-container ${isError ? 'error' : 'success'}`;
                messageContainer.style.display = 'block';
                
                // Auto-hide success messages after 5 seconds
                if (!isError) {
                    setTimeout(() => {
                        messageContainer.style.display = 'none';
                    }, 5000);
                }
            }
            
            // Toggle loading state
            function setLoading(isLoading) {
                const btnText = document.querySelector('.btn-text');
                const btnLoader = document.querySelector('.btn-loader');
                
                if (isLoading) {
                    btnText.style.display = 'none';
                    btnLoader.style.display = 'inline-flex';
                    signupBtn.disabled = true;
                } else {
                    btnText.style.display = 'inline';
                    btnLoader.style.display = 'none';
                    signupBtn.disabled = false;
                }
            }
            
            // Email/Password Signup
            signupForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const firstName = document.getElementById('firstName').value.trim();
                const lastName = document.getElementById('lastName').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const termsAccepted = document.getElementById('terms').checked;
                
                // Validation
                if (!firstName || !lastName || !email || !password) {
                    showMessage('Please fill in all fields.', true);
                    return;
                }
                
                if (password !== confirmPassword) {
                    showMessage('Passwords do not match.', true);
                    return;
                }
                
                if (password.length < 6) {
                    showMessage('Password must be at least 6 characters long.', true);
                    return;
                }
                
                if (!termsAccepted) {
                    showMessage('Please accept the Terms of Service and Privacy Policy.', true);
                    return;
                }
                
                setLoading(true);
                
                try {
                    // Create user with email and password
                    const userCredential = await window.createUserWithEmailAndPassword(
                        window.firebaseAuth, 
                        email, 
                        password
                    );
                    
                    const user = userCredential.user;
                    
                    // Update user profile with name
                    await window.updateProfile(user, {
                        displayName: `${firstName} ${lastName}`
                    });
                    
                    showMessage('Account created successfully! Redirecting...', false);
                    
                    // Redirect after successful signup
                    setTimeout(() => {
                        window.location.href = '/dashboard'; // Change this to your desired redirect URL
                    }, 2000);
                    
                } catch (error) {
                    console.error('Signup error:', error);
                    
                    // Handle specific Firebase errors
                    let errorMessage = 'An error occurred during signup.';
                    
                    switch (error.code) {
                        case 'auth/email-already-in-use':
                            errorMessage = 'This email address is already registered.';
                            break;
                        case 'auth/invalid-email':
                            errorMessage = 'Please enter a valid email address.';
                            break;
                        case 'auth/operation-not-allowed':
                            errorMessage = 'Email/password accounts are not enabled.';
                            break;
                        case 'auth/weak-password':
                            errorMessage = 'Password is too weak. Please choose a stronger password.';
                            break;
                        default:
                            errorMessage = error.message;
                    }
                    
                    showMessage(errorMessage, true);
                } finally {
                    setLoading(false);
                }
            });
            
            // Google Sign-In
            googleSignInBtn.addEventListener('click', async function() {
                try {
                    const result = await window.signInWithPopup(window.firebaseAuth, window.googleProvider);
                    const user = result.user;
                    
                    showMessage('Successfully signed in with Google! Redirecting...', false);
                    
                    // Redirect after successful Google sign-in
                    setTimeout(() => {
                        window.location.href = '/dashboard'; // Change this to your desired redirect URL
                    }, 2000);
                    
                } catch (error) {
                    console.error('Google sign-in error:', error);
                    
                    let errorMessage = 'An error occurred during Google sign-in.';
                    
                    switch (error.code) {
                        case 'auth/popup-closed-by-user':
                            errorMessage = 'Sign-in was cancelled.';
                            break;
                        case 'auth/popup-blocked':
                            errorMessage = 'Popup was blocked. Please allow popups and try again.';
                            break;
                        default:
                            errorMessage = error.message;
                    }
                    
                    showMessage(errorMessage, true);
                }
            });
            
            // Real-time password confirmation validation
            document.getElementById('confirmPassword').addEventListener('input', function() {
                const password = document.getElementById('password').value;
                const confirmPassword = this.value;
                
                if (confirmPassword && password !== confirmPassword) {
                    this.setCustomValidity('Passwords do not match');
                } else {
                    this.setCustomValidity('');
                }
            });
        });
    </script>
    
    <!-- External scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/ScrollSmoother.min.js"></script>
    
    <!-- Animation Script -->
    <script>
        // GSAP Animations
        gsap.registerPlugin(ScrollTrigger);
        
        // Initial animations
        gsap.from('.slide-in-left', {
            duration: 1,
            x: -100,
            opacity: 0,
            ease: 'power2.out'
        });
        
        gsap.from('.slide-in-right', {
            duration: 1,
            x: 100,
            opacity: 0,
            ease: 'power2.out',
            delay: 0.2
        });
        
        gsap.from('.fade-in', {
            duration: 1,
            y: 30,
            opacity: 0,
            ease: 'power2.out',
            delay: 0.4
        });
    </script>
</body>
</html>
